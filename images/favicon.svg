<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Toalhão">
  <!-- Toalha laranja da marca Toalhão, pendurada no varão -->
  <g stroke="#201450" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- varão: só o trecho à esquerda aparece; o resto fica atrás da toalha -->
    <path d="M9 14 H26" stroke="#fff" stroke-width="9"/>
    <path d="M9 14 H26"/>
    <circle cx="9.5" cy="14" r="5.5" fill="#fff"/>
    <!-- corpo da toalha -->
    <path d="M17 9 C13.5 24 12.5 40 13 56 C13.1 59 14.8 60.3 17.8 60.2 C31 59.8 33 59.8 46.2 60.2 C49.2 60.3 50.9 59 51 56 C51.5 40 50.5 24 47 9 Z"
          fill="#FC8309"/>
    <!-- vinco do avesso -->
    <path d="M17 9 C20.5 15 21.8 21 21.4 27.5" stroke-width="3"/>
    <!-- bainha -->
    <path d="M13.3 47 C23 44.6 32 48.8 41 46.6 C44.8 45.7 47.9 44.3 50.6 42.6"
          stroke="#fff" stroke-width="4"/>
  </g>
</svg>
