<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Toalhão">
  <!-- A toalha da marca Toalhão: laranja #FC8309, contorno #201450, pendurada
       no varão de pontas arredondadas, com a bainha diagonal e a dobra lateral. -->
  <defs>
    <path id="varao" d="M10 38 L92 19"/>
    <path id="corpo" d="M36 16
             C48 11 62 10 74.5 14
             C76.6 27 75.4 42 76.4 57
             C75.6 71 74.2 84 72 91
             C60 95 48 95.2 38.5 92.6
             C34.6 91.6 31.4 89 30 84.6
             C29 72 29.4 57 29.8 44
             C30.3 31 33 20 36 16 Z"/>
    <path id="vinco" d="M38.6 15.2 C35.6 30 35 48 35.6 64 C36 77 37 86 38.8 93.4"/>
    <path id="bainha" d="M30.3 78.5 C45 84 61 82.6 76.6 74"/>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#fff" stroke-width="8.6">
      <use href="#varao"/>
      <circle cx="10" cy="38" r="6.8"/>
      <circle cx="92" cy="18" r="5.4"/>
      <use href="#corpo"/>
    </g>
    <use href="#varao" stroke="#fff" stroke-width="5.4"/>
    <use href="#varao" stroke="#201450" stroke-width="3.1"/>
    <circle cx="10" cy="38" r="6.8" fill="#fff" stroke="#201450" stroke-width="3.1"/>
    <circle cx="92" cy="18" r="5.4" fill="#fff" stroke="#201450" stroke-width="3.1"/>
    <use href="#corpo" fill="#FC8309" stroke="#201450" stroke-width="3.1"/>
    <use href="#vinco" stroke="#201450" stroke-width="2.4"/>
    <use href="#bainha" stroke="#201450" stroke-width="4.6"/>
    <use href="#bainha" stroke="#fff" stroke-width="2.2"/>
  </g>
</svg>
