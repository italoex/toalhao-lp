name: Otimizar mídias

# Roda sempre que algum arquivo entrar ou mudar na pasta midias/.
# Também dá para rodar na mão pela aba Actions do GitHub.
on:
  push:
    paths:
      - 'midias/**'
      - 'scripts/midias.py'
      - '.github/workflows/midias.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Instalar Pillow
        run: python3 -m pip install --quiet --upgrade pillow

      - name: Processar as mídias
        run: python3 scripts/midias.py

      - name: Publicar os arquivos otimizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- images/; then
            echo "Nada mudou em images/ — nenhum commit necessário."
            exit 0
          fi

          git add images/
          git commit -m "Otimiza mídias enviadas para midias/

          Gerado automaticamente por .github/workflows/midias.yml a partir
          dos originais em midias/."
          git push
